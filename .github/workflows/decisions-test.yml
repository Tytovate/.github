# Gate for the decisions tools: unit tests, plus a real call of the reusable workflow on a fixture.
name: decisions-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  caller:
    uses: ./.github/workflows/decisions-check.yml
    with:
      dir: decisions/test/fixtures/ok
      prefix: fixture
